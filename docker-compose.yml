name: bd-train-delays

x-spark-common: &spark-common
  build: ./docker/spark
  image: bd-train-delays/spark:4.0.1
  volumes:
    - ./data:/opt/project/data
    - ./src:/opt/project/src
    - ./notebooks:/opt/project/notebooks
  networks: [bd]

services:
  # ---------- Kafka (KRaft, no ZooKeeper) ----------
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9094:9094"            # from host: localhost:9094 ; from containers: kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [bd]

  # creates topics once Kafka is healthy, then exits
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in train-updates delay-predictions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    networks: [bd]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"            # http://localhost:8085
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
    networks: [bd]

  # ---------- Spark standalone cluster ----------
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"            # Spark master UI
      - "7077:7077"
    environment:
      SPARK_MASTER_HOST: spark-master

  spark-worker:
    <<: *spark-common
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    deploy:
      replicas: 2              # scale: docker compose up --scale spark-worker=N
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g

  # ---------- Jupyter = Spark driver (same Python as workers) ----------
  jupyter:
    <<: *spark-common
    container_name: jupyter
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --ServerApp.token='' --ServerApp.root_dir=/opt/project
    ports:
      - "8888:8888"            # http://localhost:8888
      - "4040:4040"            # Spark application UI
    environment:
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka:9092
      PYTHONPATH: /opt/project/src
      HOME: /tmp
      JUPYTER_RUNTIME_DIR: /tmp/jupyter-runtime
      JUPYTER_DATA_DIR: /tmp/jupyter-data
    depends_on: [spark-master]

networks:
  bd:
